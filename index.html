<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Caveat+Brush&display=swap" rel="stylesheet">
<style>
:root{--kraft:#d6bd92;--kraft2:#bf9f6f;--ink:#7a1a14;--rose:#c9575f;--cream:#f8ebd2;--pw:420px;--ph:350px;--k:1;
 --hand:'Gaegu','Bradley Hand','Segoe Print','Comic Sans MS',cursive;--brush:'Caveat Brush','Gaegu','Bradley Hand',cursive;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--kraft:#a98c62;--kraft2:#8f7249}}
:root[data-theme="dark"]{--kraft:#a98c62;--kraft2:#8f7249}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 40%,var(--kraft) 0%,var(--kraft) 55%,var(--kraft2) 100%);font-family:var(--hand);color:var(--ink);user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9 .04' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(48px,9vh) 8px 56px;perspective:2200px}
#book{position:relative;width:calc(var(--pw)*2);height:var(--ph);flex:none;transform:scale(var(--k)) translateX(calc(var(--pw)*-.5));transition:transform 1.1s cubic-bezier(.65,0,.25,1)}
#book.open{transform:scale(1) translateX(0)}
.page,.face{background:var(--cream);box-shadow:0 10px 28px rgba(70,35,10,.35),0 2px 4px rgba(70,35,10,.3);overflow:visible;border-radius:3px}
.page::after,.face::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:3px}
#rp{position:absolute;left:50%;top:0;width:50%;height:100%}
#rp::after{background:linear-gradient(90deg,rgba(80,40,10,.28),rgba(80,40,10,0) 9%)}
#flap{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.65,0,.25,1);z-index:5}
#book.open #flap{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#cover{cursor:pointer;overflow:hidden}
#cover img{position:absolute;left:0;top:50%;width:100%;transform:translateY(-50%);display:block}
#cover::after{background:linear-gradient(90deg,rgba(80,40,10,.3),rgba(80,40,10,0) 6%)}
#lp{transform:rotateY(180deg)}
#lp::after{background:linear-gradient(270deg,rgba(80,40,10,.28),rgba(80,40,10,0) 9%)}
#env{position:absolute;left:9%;width:82%;top:50%;transform:translateY(-50%);aspect-ratio:1.1329}
#env>img{width:100%;height:100%;display:block;pointer-events:none}
#letter{position:absolute;left:20.559%;top:18.987%;width:69.832%;aspect-ratio:16/9;cursor:pointer;
 clip-path:polygon(99.68% 0.28%,0.16% 0.57%,0.32% 24.46%,43.2% 86.19%,57.28% 86.19%,99.68% 25.88%);transition:transform .8s cubic-bezier(.3,.9,.3,1),clip-path .5s ease .1s,filter .5s;outline:none}
#letter.up{clip-path:polygon(-25% -25%,125% -25%,125% 125%,125% 125%,-25% 125%,-25% 125%);z-index:30;filter:drop-shadow(0 16px 22px rgba(60,25,5,.5));transition:transform .8s cubic-bezier(.3,.9,.3,1),clip-path .2s ease,filter .5s}
#letter img{width:100%;height:100%;display:block;pointer-events:none;border-radius:2px}
#dim{position:fixed;inset:0;background:rgba(50,25,8,.35);opacity:0;pointer-events:none;transition:opacity .5s;z-index:20}
#dim.on{opacity:1;pointer-events:auto}
#cakebox{position:absolute;left:50%;top:22%;height:67%;aspect-ratio:0.8395;transform:translateX(-50%)}
#cakebox>img{width:100%;height:100%;display:block;pointer-events:none}
.flame{position:absolute;transform-origin:50% 94%;transition:opacity .35s,transform .45s cubic-bezier(.4,1.6,.5,1);pointer-events:none}
.flame img{width:100%;height:100%;display:block;filter:drop-shadow(0 0 7px rgba(255,185,60,.75));animation:flick 1.1s ease-in-out infinite alternate}
.flame:nth-child(3) img{animation-duration:.9s;animation-delay:-.4s}.flame:nth-child(4) img{animation-duration:1.3s;animation-delay:-.7s}
@keyframes flick{from{transform:rotate(-2.2deg) scale(1,1)}to{transform:rotate(2.4deg) scale(.97,1.04)}}
.flame.out{opacity:0;transform:translateY(-10%) scale(.15) rotate(18deg)!important}
.smoke{position:absolute;width:26%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(110,95,85,.55),rgba(110,95,85,0) 70%);pointer-events:none;animation:rise 1.6s ease-out forwards}
@keyframes rise{from{opacity:.9;transform:translate(-50%,0) scale(.4)}to{opacity:0;transform:translate(-30%,-260%) scale(1.8)}}
#wish{position:absolute;left:0;right:0;top:3%;text-align:center;font-family:var(--brush);font-size:calc(var(--pw)*.09);line-height:1.05;color:var(--ink);opacity:0;transform:scale(.6) rotate(-3deg);pointer-events:none;transition:opacity .5s,transform .7s cubic-bezier(.3,1.6,.5,1);text-shadow:2px 2px 0 rgba(235,150,150,.7)}
#wish.on{opacity:1;transform:scale(1) rotate(-2deg)}
#ctl{position:absolute;left:5%;right:5%;bottom:2.5%;display:flex;align-items:center;gap:3%;font-size:max(12px,calc(var(--pw)*.036))}
#meterw{flex:1;min-width:0}
.meter{position:relative;height:calc(var(--pw)*.03);min-height:9px;border-radius:99px;background:rgba(122,26,20,.16);box-shadow:inset 0 0 0 1.5px rgba(122,26,20,.55);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#e7a0a0,#c9575f 60%,#8e1b1b)}
.meter b{position:absolute;top:0;bottom:0;left:35%;width:2px;background:var(--ink);opacity:.65}
#note{display:block;margin-top:2px;line-height:1.05;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:#fff4e6;background:var(--rose);border:0;border-radius:99px;padding:.3em 1em;cursor:pointer;box-shadow:0 2px 0 #8e2f37,0 4px 8px rgba(70,30,10,.3);font-weight:700;touch-action:manipulation}
button:active,button.hold{transform:translateY(2px);box-shadow:0 0 0 #8e2f37}
button:focus-visible,#letter:focus-visible,#cover:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px var(--ink)}
#hold,#relight{flex:none;font-size:1.05em}
#relight{display:none;background:var(--ink);box-shadow:0 2px 0 #3d0a07}
.done #hold{display:none}.done #relight{display:block}
#back{margin-top:18px;opacity:0;pointer-events:none;transition:opacity .5s;font-size:20px;background:var(--ink);box-shadow:0 2px 0 #3d0a07,0 4px 8px rgba(70,30,10,.3)}
#book.open~#back{opacity:1;pointer-events:auto;transition-delay:.7s}
#hint{position:absolute;left:0;right:0;bottom:max(18px,4vh);text-align:center;font-size:22px;font-weight:700;transition:opacity .5s;pointer-events:none}
body.opened #hint{opacity:0}
#conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){#book,#flap,#letter{transition-duration:.01s!important}.flame img{animation:none}}
</style>
</head>

const $=s=>document.querySelector(s);
const book=$('#book'),letter=$('#letter'),dim=$('#dim'),cakebox=$('#cakebox'),note=$('#note'),meter=$('#meter i');
const rp=$('#rp');
let open=false,up=false,out=false,hold=false,micOn=false,micTried=false;

/* sizing */
function fit(){
  const vw=innerWidth,vh=innerHeight;
  const pw=Math.max(150,Math.min(vw*.465,(vh-150)*1.2,640)),ph=pw/1.2;
  const r=document.documentElement.style;
  r.setProperty('--pw',pw+'px');r.setProperty('--ph',ph+'px');
  r.setProperty('--k',Math.max(1,Math.min(vw*.9/pw,(vh-170)/ph,1.7)));
  if(up)liftLetter();
}
addEventListener('resize',fit);fit();

/* flames */
const flames=Object.values(A.flames).map(f=>{
  const d=document.createElement('div');d.className='flame';
  d.style.cssText=`left:${f.l}%;top:${f.t}%;width:${f.w}%;height:${f.h}%`;
  d.innerHTML=`<img alt="" src="${f.img}">`;cakebox.appendChild(d);return d;
});

/* open / close */
function openCard(){
  if(open)return;open=true;book.classList.add('open');document.body.classList.add('opened');
  initMic();
}
function closeCard(){
  if(!open)return;tuck();open=false;book.classList.remove('open');document.body.classList.remove('opened');
  setTimeout(()=>{if(!open)relight(true)},1200);
}
$('#cover').addEventListener('click',openCard);
$('#cover').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCard()}});
$('#back').addEventListener('click',closeCard);

/* letter */
function liftLetter(){
  letter.style.transform='none';
  const r=letter.getBoundingClientRect(),narrow=innerWidth<720||parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pw'))<430;
  let tw,cx,cy;
  if(narrow){tw=Math.min(innerWidth*.94,(innerHeight*.9)*16/9);cx=innerWidth/2;cy=innerHeight/2}
  else{const p=$('#lp').getBoundingClientRect();tw=Math.min(p.width*.92,p.height*.92*16/9);cx=p.left+p.width/2;cy=p.top+p.height/2}
  const s=tw/r.width;
  letter.style.transform=`translate(${cx-(r.left+r.width/2)}px,${cy-(r.top+r.height/2)}px) rotate(-1.2deg) scale(${s})`;
}
function raise(){up=true;letter.classList.add('up');dim.classList.add('on');liftLetter()}
function tuck(){up=false;letter.classList.remove('up');dim.classList.remove('on');letter.style.transform=''}
const toggle=()=>up?tuck():raise();
letter.addEventListener('click',e=>{e.stopPropagation();toggle()});
letter.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
dim.addEventListener('click',tuck);

/* mic */
let ac,an,td,fd,floor=.006,rawN=0,lowR=1;
async function initMic(){
  if(micTried&&micOn)return;micTried=true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext){
    note.textContent='Mic needs https. Hold the button or Space.';return}
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    ac=new(window.AudioContext||window.webkitAudioContext)();await ac.resume();
    an=ac.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.2;ac.createMediaStreamSource(s).connect(an);
    td=new Float32Array(an.fftSize);fd=new Float32Array(an.frequencyBinCount);micOn=true;note.textContent='Mic ready. Blow!';
  }catch(e){micOn=false;note.textContent='Mic blocked. Hold the button or Space.'}
}
$('#meterw').addEventListener('click',()=>{if(!micOn){micTried=false;initMic()}});
function readMic(){
  an.getFloatTimeDomainData(td);let s=0;for(let i=0;i<td.length;i++)s+=td[i]*td[i];
  const rms=Math.sqrt(s/td.length);
  an.getFloatFrequencyData(fd);const bw=ac.sampleRate/an.fftSize,cut=Math.floor(1400/bw);let lo=0,all=0;
  for(let i=1;i<fd.length;i++){const p=Math.pow(10,fd[i]/10);all+=p;if(i<cut)lo+=p}
  lowR=all?lo/all:0;
  if(rms<floor*2.5+.008)floor=floor*.97+rms*.03;
  rawN=Math.max(0,Math.min(1,(rms-floor*1.6)/.07));
}

/* hold-to-blow fallback */
const hb=$('#hold');
const holdOn=v=>{hold=v;hb.classList.toggle('hold',v)};
hb.addEventListener('pointerdown',e=>{e.preventDefault();hb.setPointerCapture(e.pointerId);holdOn(true)});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>hb.addEventListener(t,()=>holdOn(false)));
addEventListener('keydown',e=>{if(e.code==='Space'&&open&&!up){e.preventDefault();if(!e.repeat)holdOn(true)}});
addEventListener('keyup',e=>{if(e.code==='Space')holdOn(false)});
hb.addEventListener('contextmenu',e=>e.preventDefault());

/* loop */
let lvl=0,bend=0,acc=0,last=performance.now(),tt=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;
  let n=0;
  if(hold)n=.8+.12*Math.sin(tt*37);
  else if(micOn&&open){readMic();n=lowR>.4?rawN:rawN*.4}
  lvl+=(n-lvl)*(n>lvl?.5:.15);
  meter.style.width=(lvl*100)+'%';
  if(open&&!out){
    bend+=(lvl-bend)*.25;
    flames.forEach((f,i)=>{
      const b=bend,fl=Math.sin(tt*34+i*2)*b*4;
      f.style.transform=b>.03?`rotate(${b*20+fl}deg) skewX(${-b*30}deg) scale(${1-b*.12},${1-b*.22})`:'';
    });
    if(lvl>.35)acc+=dt;else acc=Math.max(0,acc-dt*.9);
    if(acc>=.5)extinguish();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* out / relight */
function extinguish(){
  out=true;acc=0;
  flames.forEach((f,i)=>setTimeout(()=>{
    f.style.transform='';f.classList.add('out');
    const s=document.createElement('span');s.className='smoke';
    s.style.left=(parseFloat(f.style.left)+parseFloat(f.style.width)/2)+'%';s.style.top=f.style.top;
    cakebox.appendChild(s);setTimeout(()=>s.remove(),1700);
  },i*90));
  setTimeout(()=>{
    $('#wish').innerHTML=`make a wish,<br>${NAME}!`;$('#wish').classList.add('on');
    rp.classList.add('done');confetti();
  },650);
}
function relight(quiet){
  out=false;acc=0;bend=0;
  flames.forEach((f,i)=>setTimeout(()=>{f.style.transform='';f.classList.remove('out')},quiet?0:i*110));
  $('#wish').classList.remove('on');rp.classList.remove('done');
}
$('#relight').addEventListener('click',()=>relight());

/* confetti */
const cv=$('#conf'),cx=cv.getContext('2d');let parts=[],running=false;
function sz(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener('resize',sz);sz();
function confetti(){
  const cols=['#c9575f','#e9a3a3','#8e1b1b','#d9a441','#f3d9a4','#f08c8c'];
  const r=cakebox.getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height*.2;
  for(let i=0;i<170;i++){
    const burst=i<90,a=Math.random()*Math.PI*2,v=burst?4+Math.random()*9:0;
    parts.push({x:burst?ox:Math.random()*innerWidth,y:burst?oy:-20-Math.random()*innerHeight*.3,
      vx:burst?Math.cos(a)*v:(Math.random()-.5)*2,vy:burst?Math.sin(a)*v-6:2+Math.random()*3,
      w:6+Math.random()*8,h:4+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.3,
      c:cols[i%cols.length],heart:Math.random()<.18,life:0});
  }
  if(!running){running=true;requestAnimationFrame(step)}
}
function step(){
  const d=devicePixelRatio;cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.scale(d,d);
  parts=parts.filter(p=>p.y<innerHeight+30&&p.life<420);
  for(const p of parts){
    p.life++;p.vy+=.18;p.vx*=.985;p.vy*=.985;p.x+=p.vx+Math.sin(p.life/9+p.rot)*.7;p.y+=p.vy;p.rot+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
    if(p.heart){cx.beginPath();cx.moveTo(0,4);cx.bezierCurveTo(-8,-2,-4,-8,0,-3);cx.bezierCurveTo(4,-8,8,-2,0,4);cx.fill()}
    else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.restore();
  }
  if(parts.length)requestAnimationFrame(step);else{running=false;cx.clearRect(0,0,cv.width,cv.height)}
}
})();
</script>
</body>
